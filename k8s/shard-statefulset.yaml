apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shard
  namespace: search
  labels:
    app: shard
spec:
  serviceName: shard-headless
  replicas: 4
  podManagementPolicy: Parallel   # start all shards simultaneously
  selector:
    matchLabels:
      app: shard
  template:
    metadata:
      labels:
        app: shard
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: shard
          image: search-engine:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--mode=shard"
            - "--config=/etc/search/shard-config.yaml"
          # HOSTNAME is automatically set to pod name (shard-0, shard-1, …)
          # The binary parses the ordinal from HOSTNAME for shard_id.
          ports:
            - name: grpc
              containerPort: 9001
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 9001
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 9001
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/search
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: search-engine-config
            items:
              - key: shard-config.yaml
                path: shard-config.yaml
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 50Gi

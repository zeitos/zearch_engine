apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  namespace: search
  labels:
    app: router
spec:
  replicas: 2
  selector:
    matchLabels:
      app: router
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: router
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: router
          image: search-engine:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--mode=router"
            - "--config=/etc/search/router-config.yaml"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: config
              mountPath: /etc/search
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: search-engine-config
            items:
              - key: router-config.yaml
                path: router-config.yaml

apiVersion: v1
kind: Service
metadata:
  name: shard-replica-headless
  namespace: search
  labels:
    app: shard-replica
spec:
  clusterIP: None   # headless — enables per-pod DNS: shard-replica-N.shard-replica-headless.search.svc
  selector:
    app: shard-replica
  ports:
    - name: grpc
      port: 9001
      targetPort: grpc
      protocol: TCP

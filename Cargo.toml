[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/proto",
    "crates/analysis",
    "crates/index",
    "crates/query",
    "crates/shard",
    "crates/ranker",
    "crates/router",
    "crates/server",
    "crates/meli",
    "crates/suggest",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Internal crates
search-core = { path = "crates/core" }
search-proto = { path = "crates/proto" }
search-analysis = { path = "crates/analysis" }
search-index = { path = "crates/index" }
search-query = { path = "crates/query" }
search-shard = { path = "crates/shard" }
search-ranker = { path = "crates/ranker" }
search-router = { path = "crates/router" }
search-suggest = { path = "crates/suggest" }

# WASM runtime
wasmtime = "24"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1" }

# HTTP
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
moka = { version = "0.12", features = ["future"] }

# gRPC
tonic = "0.12"
prost = "0.13"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Config
clap = { version = "4", features = ["derive"] }
serde_yaml = "0.9"

# Index structures
fst = { version = "0.4", features = ["levenshtein"] }
memmap2 = "0.9"
roaring = "0.10"

# Text analysis
rust-stemmers = "1"
unicode-segmentation = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.27"

# OpenTelemetry
opentelemetry = { version = "0.26", features = ["trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.26", features = ["grpc-tonic"] }
opentelemetry-semantic-conventions = "0.26"

# HTTP middleware
tower-http = { version = "0.6", features = ["trace"] }

# Error handling
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"

# Metrics
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

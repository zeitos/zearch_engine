[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/proto",
    "crates/analysis",
    "crates/index",
    "crates/query",
    "crates/shard",
    "crates/ranker",
    "crates/router",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Internal crates
search-core = { path = "crates/core" }
search-proto = { path = "crates/proto" }
search-analysis = { path = "crates/analysis" }
search-index = { path = "crates/index" }
search-query = { path = "crates/query" }
search-shard = { path = "crates/shard" }
search-ranker = { path = "crates/ranker" }
search-router = { path = "crates/router" }

# WASM runtime
wasmtime = "21"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP
axum = "0.7"

# gRPC
tonic = "0.12"
prost = "0.13"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Config
clap = { version = "4", features = ["derive"] }
serde_yaml = "0.9"

# Index structures
fst = { version = "0.4", features = ["levenshtein"] }
memmap2 = "0.9"
roaring = "0.10"

# Text analysis
rust-stemmers = "1"
unicode-segmentation = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"

# Metrics
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
